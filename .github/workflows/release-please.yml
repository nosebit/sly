name: Release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release-please
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a release PR (version bump + CHANGELOG) from the
      # Conventional Commits merged into main. Merging that PR tags the
      # release (vX.Y.Z) and publishes a GitHub Release, which is what
      # install.sh downloads.
      #
      # A PAT (GH_RELEASE_TOKEN) is used instead of GITHUB_TOKEN so that CI
      # runs on the release PR; it falls back to GITHUB_TOKEN if not set.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
